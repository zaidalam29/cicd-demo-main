name: Docker Image CI

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: 📦 Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: 📥 Install Dependencies
        run: npm install

      # Step 4: Build Docker image
      - name: 🐳 Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest .

      # Step 5: Docker Login
      - name: 🔐 Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 6: Push image to Docker Hub
      - name: 📤 Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      # Step 7: Deploy to EC2 via SSH
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}                # EC2 public IP
          username: ${{ secrets.EC2_USER }}            # usually 'ubuntu' or 'ec2-user'
          key: ${{ secrets.EC2_SSH_KEY }}              # PEM format SSH private key
          port: 22
          debug: true
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest
            docker stop demo || true
            docker rm demo || true
            docker run -d --name demo -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      - name: ✅ Done
        run: echo "🚀 Deployment to EC2 completed successfully!"
